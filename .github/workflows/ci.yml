name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 运行时兼容线是 Node 18（engines >=18）；仅 22 出覆盖率报告
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 服务端语法检查
        run: |
          node --check server.js
          node --check lib/jobs.js
          node --check lib/briefs.js
          node --check public/sw.js
      - name: 题库完整性
        run: |
          node -e "
            const q = require('./data/questions.json');
            const cats = new Set(q.categories.map(c => c.key));
            const ids = new Set();
            for (const x of q.questions) {
              if (!cats.has(x.cat)) throw new Error('未分类题目: ' + x.id);
              if (ids.has(x.id)) throw new Error('重复 ID: ' + x.id);
              ids.add(x.id);
              if (!x.q || !x.a) throw new Error('题干/答案缺失: ' + x.id);
            }
            console.log('题库', q.questions.length, '题，', q.categories.length, '个分类，校验通过');
          "
      - name: 前端模块导入自检（ESM 链接完整性，node 18 无法加载 .js 里的 ESM，跳过）
        if: matrix.node-version != 18
        run: |
          node -e "
            const { pathToFileURL } = require('url');
            const path = require('path');
            const mods = [
              './public/js/app.js', './public/js/router.js', './public/js/state.js',
              './public/js/core.js', './public/js/api.js', './public/js/srs.js', './public/js/gamify.js',
              ...['dashboard','mock','bank','review','jobs','knowledge','resume','history','settings','agent','flashcards']
                .map(v => './public/js/views/' + v + '.js'),
            ];
            (async () => {
              for (const m of mods) await import(pathToFileURL(path.resolve(m)).href);
              console.log(mods.length + ' 个模块导入通过');
            })();
          "
      - name: manifest 校验
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.json','utf8')); console.log('manifest OK')"
      - name: 安装 dev 依赖（eslint；运行时依赖仍为 0）
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 版本号一致性（package.json ← sw.js / index.html）
        run: node scripts/sync-version.mjs --check
      - name: 行为测试（node:test，零依赖）
        run: npm test
      - name: 覆盖率报告（仅 Node 22，先不做硬门槛）
        if: matrix.node-version == 22
        run: node --test --experimental-test-coverage
      - name: 启动冒烟（起 server → 轮询 /api/health → kill）
        if: matrix.node-version == 22
        shell: bash
        run: |
          PORT=3777 node server.js > smoke.log 2>&1 & SRV=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3777/api/health | grep -q '"ok":true'; then
              ok=1; break
            fi
            sleep 0.5
          done
          kill $SRV 2>/dev/null || true
          if [ -z "$ok" ]; then echo "health 轮询超时"; cat smoke.log; exit 1; fi
          echo "启动冒烟 OK（health 返回 ok:true）"
